<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIIN KM</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
    width: 100%;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas { display: block; margin: auto; }
  #msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 0, 0, 0.5);
    font-family: sans-serif;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
  }
</style>
</head>
<body>
<div id="msg">toque na tela para começar</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = Math.min(window.innerWidth, 600);
canvas.height = Math.min(window.innerHeight, 670);
ctx.strokeStyle = 'red';
ctx.lineWidth = 2;
const cx = canvas.width / 2;
const cy = canvas.height / 2;
let x = 0, y = 0;
let px = 0, py = 0;
let angle = 0;
let lastX = cx + px;
let lastY = cy + py;
let travado = false;

// Função que entra em tela cheia
function entrarTelaCheia() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

// No primeiro toque: tela cheia + trava tudo
function iniciar() {
  entrarTelaCheia();
  travado = true;
  document.getElementById('msg').style.display = 'none';
  document.body.style.pointerEvents = 'none';
  document.removeEventListener('click', iniciar);
  document.removeEventListener('touchstart', iniciar);
}

document.addEventListener('click', iniciar);
document.addEventListener('touchstart', iniciar);

function loop() {
  const rad = angle * Math.PI / 180;
  px += x * Math.cos(rad);
  py += x * Math.sin(rad);
  angle += y;
  x += 3;
  y += 1;
  const newX = cx + px;
  const newY = cy + py;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(newX, newY);
  ctx.stroke();
  lastX = newX;
  lastY = newY;
  if (y < 210) {
    requestAnimationFrame(loop);
  }
}
loop();
</script>
</body>
</html>
